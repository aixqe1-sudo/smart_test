[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-x-qe-smart-test-selector"
version = "0.1.0"
requires-python = ">=3.10"
description = "A reproducible change-impact testing lab"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["shop*", "tools*"]
